<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline vs Block Menu</title>

    <style>
        .menu-inline a {
            display: inline;     /* All in one row */
            margin-right: 20px;
            text-decoration: none;
            color: rgb(33, 182, 4);
        }

        .menu-block a {
            display: block;      /* Each link on new line */
            margin-bottom: 10px;
            text-decoration: none;
            color: green;
        }
    </style>
</head>

<body>

<h2>Inline Navigation Menu</h2>
<div class="menu-inline">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</div>

<hr>

<h2>Block Navigation Menu</h2>
<div class="menu-block">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</div>

</body>
</html>
